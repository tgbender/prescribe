[project]
name = "prescribe"
version = "0.5.1"
description = "Declarative dotfile, shell, and environment configuration management."
authors = [{ name = "Travis Bender" }]
readme = "README.md"
requires-python = ">=3.12"
keywords = ["dotfiles", "configuration", "shell", "environment", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Installation/Setup",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]
dependencies = [
  "platformdirs>=4.0,<5.0",
  "ruamel-yaml>=0.19.1,<0.20.0",
  "safe-fs-ops>=0.1.1,<0.2.0",
  "sqlalchemy>=2.0.49",
  "tomlkit>=0.14.0,<0.15.0",
  "typer>=0.9,<1.0",
  "winregenv>=0.2.0; sys_platform == 'win32'",
]

[project.scripts]
prescribe = "prescribe.cli:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["mypy>=1.0,<2.0", "pytest>=9.0.3,<10.0.0", "pyfakefs>=6.2,<7.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
  "cli: tests that invoke the installed prescribe CLI",
  "stress_lock: opt-in multi-process lock contention tests; run with --stress-locks",
  "platform_windows: tests that require native Windows runtime support",
  "platform_posix: tests that require POSIX runtime support",
  "platform_macos: tests that require native macOS runtime support",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  "B008", # typer.Argument/Option in defaults is the intended Typer pattern
]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["tests/"]
