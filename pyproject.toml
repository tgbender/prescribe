[project]
name = "prescribe"
version = "0.2.0"
authors = [{ name = "Travis Bender" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "platformdirs>=4.0,<5.0",
  "ruamel-yaml>=0.19.1,<0.20.0",
  "sqlalchemy>=2.0.49",
  "tomlkit>=0.14.0,<0.15.0",
  "typer>=0.9,<1.0",
  "winregenv>=0.2.0; sys_platform == 'win32'",
]

[project.scripts]
prescribe = "prescribe.cli:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["mypy>=1.0,<2.0", "pytest>=9.0.3,<10.0.0", "pyfakefs>=6.2,<7.0.0"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  "B008", # typer.Argument/Option in defaults is the intended Typer pattern
]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["tests/"]
