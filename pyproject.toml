[project]
name = "config-helper"
version = "0.1.0"
authors = [
    { name = "Travis Bender", email = "travisgbender@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "json5>=0.12.1,<0.13.0",
    "ruamel-yaml>=0.19.1,<0.20.0",
    "tomlkit>=0.14.0,<0.15.0",
]

[project.optional-dependencies]
cli = ["typer>=0.9,<1.0"]

[project.scripts]
config-helper = "config_helper.cli:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pyfakefs>=6.2,<7.0.0",
]
